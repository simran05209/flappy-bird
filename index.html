<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>
    
    <div class="bird" id="bird">
        <!-- FIXED: Pointing directly to Bird.png in your main directory -->
        <img src="Bird.png" id="bird-1" alt="bird-img" style="width: 100%; height: 100%; display: none;">
    </div>

    <!-- Game Message Window -->
    <div class="message messageStyle" id="game-message">
        Press <b>Enter</b> to Start Game
    </div>

    <!-- Score Box Display -->
    <div class="score" id="score-box" style="display: none;">
        Score: <span class="score_val">0</span>
    </div>

    <!-- Authentication Area -->
    <div class="auth" id="auth-box">
        <h2>Flappy Bird Login</h2>
        <div id="auth-error" style="color: red; font-size: 0.9em; margin-bottom: 5px;"></div>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <br>
        <button onclick="login()">Login</button>
        <button onclick="signup()">Sign Up</button>
    </div>

    <!-- Last Score History Box -->
    <div class="score-history" id="score-history" style="display: none;">
        <h3>Your Last 3 Scores:</h3>
        <ul id="last-scores"></ul>
    </div>

    <!-- Overlay Play Menu Container -->
    <div class="play-area" id="play-section" style="display: none;">
        <button class="play-btn" onclick="showGameStartMessage()">Set Game Ready</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
